name: CI

# The release gate (docs/25 Phase 3).
#
# There was no CI at all before this: the browser suite had been red since
# 13 July 2026 and nothing enforced it, so every change to checkout since then
# merged with no browser coverage. "The tests exist" and "a red run blocks a
# merge" are different things, and only the second one is a gate.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Even LTS, matching server/package.json's engines field.
  NODE_VERSION: '22'

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: elite
          POSTGRES_PASSWORD: elite
          POSTGRES_DB: elite_ci
        ports: ['5432:5432']
        # Without a health check the suite starts before Postgres accepts
        # connections and fails for a reason that has nothing to do with the code.
        options: >-
          --health-cmd "pg_isready -U elite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://elite:elite@127.0.0.1:5432/elite_ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  client-build:
    name: Admin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build:admin
        working-directory: client

  browser:
    name: POS browser gate
    runs-on: ubuntu-latest
    needs: [server, client-build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: elite
          POSTGRES_PASSWORD: elite
          POSTGRES_DB: elite_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U elite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://elite:elite@127.0.0.1:5432/elite_ci
      # ALERT_EMAIL is deliberately unset: this suite provokes offline queues
      # and failed sales on purpose. The per-tenant guard in lib/alerts.js
      # (isTestTenant) is the second layer.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      # The Playwright config starts the API and the admin dev server itself.
      - run: npm run test:e2e
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
        working-directory: server
      # Production dependencies only, high and above. Known-accepted findings
      # belong in an explicit allowlist, never behind a blanket --force.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: server
