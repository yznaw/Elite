# Nginx site for elitecollections.qa.
#
# Deployed to /etc/nginx/sites-available/elite. See docs/09-nginx-https.md for
# the install and certificate steps.
#
# Compression lives in deploy/nginx/compression.conf -> /etc/nginx/conf.d/,
# because those are http-context directives and belong nowhere near a site
# file. See the comment at the top of that file.
#
# This file mirrors the actual certbot-managed structure on the host
# (verified 2026-09-11), not a clean-room layout: one certificate at
# /etc/letsencrypt/live/elitecollections.qa/ carries elitecollections.qa,
# www.elitecollections.qa and admin.elitecollections.qa as SANs, and every
# block certbot touched is left byte-for-byte as it wrote it -- comments,
# blank lines, and directive order included -- so that a future interactive
# `certbot --nginx` run (renewal alone does not touch this file) still
# recognises its own blocks instead of writing new ones alongside stale
# copies. Do not reformat the "# managed by Certbot" blocks.
#
# If this ever needs rebuilding from scratch instead of merging: run
# `sudo nginx -t` after every edit, and never `cp` this whole file over a
# live sites-available/elite blind -- diff it first. That is exactly how the
# 2026-09-11 near-outage happened: the first version of this file had no
# `listen 443 ssl` blocks at all.

upstream elite_api {
    server 127.0.0.1:3000;
}

# ── Canonical host ───────────────────────────────────────────────────────
# The original single block served elitecollections.qa and
# www.elitecollections.qa identically -- no redirect between them. Because
# the storefront builds its canonical URL from location.origin, the www copy
# was declaring itself canonical too, so the two hostnames competed as
# separate sites in search. This split give www its own 443 block whose only
# job is the 301; the apex keeps everything else. It reuses the same
# certificate (www is already a SAN on it) but is not itself a
# certbot-written block, so it carries no "managed by Certbot" tag.
server {
    listen 443 ssl;
    server_name www.elitecollections.qa;

    ssl_certificate /etc/letsencrypt/live/elitecollections.qa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elitecollections.qa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://elitecollections.qa$request_uri;
}

server {
    server_name elitecollections.qa;

    root /var/www/elite/client/dist/client-web/browser;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caching ──────────────────────────────────────────────────────────
    # index.html must never be cached: it carries the hashed filenames of the
    # current build, so a stale copy pins visitors to a deleted bundle.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Build output is content-hashed (outputHashing: all), so a changed file
    # is always a changed URL and these can be cached hard and forever.
    location ~* "^/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static assets are NOT hashed, so they get a real but short TTL.
    # Anything longer means replacing og-default.jpg or a hero image takes a
    # year to reach visitors who already have it.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(?:woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Crawlers expect the sitemap at the site root, but it is generated from
    # live catalogue data by the API. Without this block the SPA fallback
    # above would answer /sitemap.xml with index.html.
    location = /sitemap.xml {
        proxy_pass http://elite_api/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /api/ {
        proxy_pass http://elite_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 60m;
    }

    location /uploads/ {
        alias /var/www/elite/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/elitecollections.qa/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/elitecollections.qa/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    server_name admin.elitecollections.qa;

    root /var/www/elite/client/dist/admin-portal/browser;
    index index.html;

    # The admin portal is not a public search surface. This is belt and
    # braces next to the app's own auth, so a misconfigured crawl cannot
    # index it.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~* "^/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://elite_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 60m;
    }

    location /uploads/ {
        alias /var/www/elite/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/elitecollections.qa/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/elitecollections.qa/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ── Port 80: certbot-written redirects, left untouched ─────────────────────
# www still round-trips through https://www before landing on
# https://elitecollections.qa (the new block above) rather than jumping
# straight to the apex. Two hops, but editing text inside a "managed by
# Certbot" block is what the big comment at the top of this file says not to
# do, and the end result -- a 301 chain that terminates on the canonical
# host -- is what actually matters for indexing.
server {
    if ($host = www.elitecollections.qa) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = elitecollections.qa) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name elitecollections.qa www.elitecollections.qa;
    return 404; # managed by Certbot




}

server {
    if ($host = admin.elitecollections.qa) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.elitecollections.qa;
    return 404; # managed by Certbot


}
