# Nginx site for elitecollections.qa.
#
# Deployed to /etc/nginx/sites-available/elite. See docs/09-nginx-https.md for
# the install and certificate steps.
#
# Compression lives in deploy/nginx/compression.conf -> /etc/nginx/conf.d/,
# because those are http-context directives and belong nowhere near a site
# file. See the comment at the top of that file.
#
# NOTE ON CERTBOT: `certbot --nginx` rewrites whatever is on the server, adding
# `listen 443 ssl`, the certificate paths, and its own port-80 redirect blocks.
# If the live file has already been through certbot, do not overwrite it with
# this one. Merge the two marked blocks below into it instead, then
# `sudo nginx -t && sudo systemctl reload nginx`.

# Express stays private. Nginx is the public HTTPS edge.
upstream elite_api {
    server 127.0.0.1:3000;
}

# ── [1] Canonical host ───────────────────────────────────────────────────────
# www served the whole site at status 200 rather than redirecting. Because the
# storefront builds its canonical URL from location.origin, the www copy
# advertised itself as canonical, so both hostnames competed as separate sites.
# This block is the fix: www exists only to redirect.
server {
    listen 80;
    listen [::]:80;
    server_name www.elitecollections.qa;
    return 301 https://elitecollections.qa$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name elitecollections.qa;

    root /var/www/elite/client/dist/client-web/browser;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── [2] Caching ──────────────────────────────────────────────────────────
    # index.html must never be cached: it carries the hashed filenames of the
    # current build, so a stale copy pins visitors to a deleted bundle.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Build output is content-hashed (outputHashing: all), so a changed file is
    # always a changed URL and these can be cached hard and forever.
    location ~* "^/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static assets are NOT hashed, so they get a real but short TTL. Anything
    # longer means replacing og-default.jpg or a hero image takes a year to
    # reach visitors who already have it.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(?:woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Crawlers expect the sitemap at the site root, but it is generated from
    # live catalogue data by the API. Without this block the SPA fallback
    # above would answer /sitemap.xml with index.html.
    location = /sitemap.xml {
        proxy_pass http://elite_api/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://elite_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        alias /var/www/elite/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.elitecollections.qa;

    root /var/www/elite/client/dist/admin-portal/browser;
    index index.html;

    # The admin portal is not a public search surface. This is belt and braces
    # next to the app's own auth, so a misconfigured crawl cannot index it.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~* "^/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://elite_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        alias /var/www/elite/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
