# Nginx site for elitecollections.qa.
#
# Deployed to /etc/nginx/sites-available/elite. See docs/09-nginx-https.md for
# the install and certificate steps.
#
# Compression lives in deploy/nginx/compression.conf -> /etc/nginx/conf.d/,
# because those are http-context directives and belong nowhere near a site
# file. See the comment at the top of that file.
#
# This file mirrors the actual certbot-managed structure on the host
# (verified 2026-09-11), not a clean-room layout: one certificate at
# /etc/letsencrypt/live/elitecollections.qa/ carries elitecollections.qa,
# www.elitecollections.qa and admin.elitecollections.qa as SANs, and every
# block certbot touched is left byte-for-byte as it wrote it -- comments,
# blank lines, and directive order included -- so that a future interactive
# `certbot --nginx` run (renewal alone does not touch this file) still
# recognises its own blocks instead of writing new ones alongside stale
# copies. Do not reformat the "# managed by Certbot" blocks.
#
# If this ever needs rebuilding from scratch instead of merging: run
# `sudo nginx -t` after every edit, and never `cp` this whole file over a
# live sites-available/elite blind -- diff it first. That is exactly how the
# 2026-09-11 near-outage happened: the first version of this file had no
# `listen 443 ssl` blocks at all.

upstream elite_api {
    server 127.0.0.1:3000;
}

# ── Canonical host ───────────────────────────────────────────────────────
# The original single block served elitecollections.qa and
# www.elitecollections.qa identically -- no redirect between them. Because
# the storefront builds its canonical URL from location.origin, the www copy
# was declaring itself canonical too, so the two hostnames competed as
# separate sites in search. This split give www its own 443 block whose only
# job is the 301; the apex keeps everything else. It reuses the same
# certificate (www is already a SAN on it) but is not itself a
# certbot-written block, so it carries no "managed by Certbot" tag.
server {
    listen 443 ssl http2;
    server_name www.elitecollections.qa;

    ssl_certificate /etc/letsencrypt/live/elitecollections.qa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elitecollections.qa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://elitecollections.qa$request_uri;
}

server {
    server_name elitecollections.qa;

    root /var/www/elite/client/dist/client-web/browser;

    # ── Pages: server-rendered, with the old behaviour as the fallback ────
    # A built file (hashed bundle, /assets/, robots.txt, elitebooth.html) is
    # answered from disk. Anything else is a page, rendered by the elite-web
    # pm2 process (deploy/pm2/elite-web.config.cjs).
    #
    # `$uri/` and `index` are gone on purpose: the build no longer contains an
    # index.html, and a directory match would bypass the renderer.
    location / {
        try_files $uri @ssr;
    }

    location @ssr {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Loopback refuses instantly when the process is down; a render that
        # has not answered in 10s is hung, not slow.
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        # Down (502), hung (504) or crashed mid-render (500): serve the
        # client-rendered shell instead, i.e. exactly what the site did before
        # SSR. A 404 from the renderer is a real answer and passes through.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @csr;
    }

    location @csr {
        try_files /index.csr.html =503;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ── Caching ──────────────────────────────────────────────────────────
    # The shell must never be cached: it carries the hashed filenames of the
    # current build, so a stale copy pins visitors to a deleted bundle.
    # (Server-rendered pages send their own no-store from server.ts.)
    location = /index.csr.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Build output is content-hashed (outputHashing: all), so a changed file
    # is always a changed URL and these can be cached hard and forever.
    location ~* "^/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static assets are NOT hashed, so they get a real but short TTL.
    # Anything longer means replacing og-default.jpg or a hero image takes a
    # year to reach visitors who already have it.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(?:woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Crawlers expect the sitemap at the site root, but it is generated from
    # live catalogue data by the API. Without this block the SPA fallback
    # above would answer /sitemap.xml with index.html.
    location = /sitemap.xml {
        proxy_pass http://elite_api/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Uploaded images, served from disk instead of through the API.
    #
    # The storefront builds every media URL as `<apiBase>/uploads/x.webp` with
    # apiBase = /api (client-web/src/app/utils/media-url.ts), so all of them --
    # including the LCP image -- were matching `location /api/` below and being
    # proxied through node. On the API side that mount is a bare
    # express.static (server/index.js), with no auth, no signed URLs and no
    # per-request processing, so there is nothing to bypass: this is the same
    # bytes off the same disk, minus a hop.
    #
    # The alias MUST match `UPLOADS_DIR` in server/.env on this host, not the
    # package default. server/lib/storage.js falls back to `server/uploads`
    # only when UPLOADS_DIR is unset; production sets it explicitly, to a path
    # outside the app directory, because every deploy replaces `server/` and
    # uploaded media has to survive that. `/var/www/elite-uploads` is this
    # host's value, confirmed 2026-09-18 via `grep UPLOADS_DIR server/.env` --
    # it is not derivable from the repo and must be rechecked on any host where
    # this file is reused. A wrong alias here doesn't error, it just answers
    # every image with a 404 that a browser has no way to tell apart from a
    # deleted upload.
    #
    # Longest matching prefix wins in nginx and neither location is a regex, so
    # this beats `/api/` regardless of where it sits in the file.
    #
    # expires/Cache-Control mirror the express.static options exactly, so
    # already-cached copies keep the freshness they were handed.
    location /api/uploads/ {
        alias /var/www/elite-uploads/;
        # Reject active uploads even if they already exist on disk.
        if ($uri !~* "\.(jpe?g|png|webp|gif|avif)$") { return 404; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://elite_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 60m;
    }

    # SADAD posts payment notifications outside /api. Route the exact endpoint
    # to Express instead of the storefront renderer (which returns HTML 404).
    location = /webhooks/sadad {
        proxy_pass http://elite_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same target as /api/uploads/ above. Unreachable from the storefront
    # itself -- resolveClientMediaUrl() always emits the /api-prefixed form --
    # but kept in case something still links the bare path directly.
    location /uploads/ {
        alias /var/www/elite-uploads/;
        # Reject active uploads even if they already exist on disk.
        if ($uri !~* "\.(jpe?g|png|webp|gif|avif)$") { return 404; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # `http2` added to Certbot's own `listen` line, deliberately, on 2026-09-18.
    # The host runs nginx 1.24 (Ubuntu), below the 1.25.1 floor the standalone
    # `http2 on;` directive needs -- on 1.24 that form is an unknown directive
    # and `nginx -t` refuses to start. `listen 443 ssl http2;` is the only
    # spelling 1.24 accepts, which means touching a Certbot line despite the
    # warning at the top of this file. Confirmed safe first: `nginx -t` gates
    # the reload, and a future `certbot --nginx` run only ever rewrites the
    # `listen`/`ssl_certificate*` tokens it manages, not the whole line, so it
    # will not silently drop `http2` back out. Re-add it if a renewal ever does.
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/elitecollections.qa/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/elitecollections.qa/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    server_name admin.elitecollections.qa;

    root /var/www/elite/client/dist/admin-portal/browser;
    index index.html;

    # The admin portal is not a public search surface. This is belt and
    # braces next to the app's own auth, so a misconfigured crawl cannot
    # index it.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~* "^/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Same disk-served uploads as the storefront block; see the comment there
    # for why the alias is /var/www/elite-uploads and not a path under
    # server/. The admin app resolves media against /api too, so it needs its
    # own copy.
    location /api/uploads/ {
        alias /var/www/elite-uploads/;
        # Reject active uploads even if they already exist on disk.
        if ($uri !~* "\.(jpe?g|png|webp|gif|avif)$") { return 404; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://elite_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 60m;
    }

    location /uploads/ {
        alias /var/www/elite-uploads/;
        # Reject active uploads even if they already exist on disk.
        if ($uri !~* "\.(jpe?g|png|webp|gif|avif)$") { return 404; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Same reasoning as the apex block above: `http2` added to Certbot's line
    # because this host's nginx (1.24) does not support the standalone form.
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/elitecollections.qa/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/elitecollections.qa/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ── Port 80: certbot-written redirects, left untouched ─────────────────────
# www still round-trips through https://www before landing on
# https://elitecollections.qa (the new block above) rather than jumping
# straight to the apex. Two hops, but editing text inside a "managed by
# Certbot" block is what the big comment at the top of this file says not to
# do, and the end result -- a 301 chain that terminates on the canonical
# host -- is what actually matters for indexing.
server {
    if ($host = www.elitecollections.qa) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = elitecollections.qa) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name elitecollections.qa www.elitecollections.qa;
    return 404; # managed by Certbot




}

server {
    if ($host = admin.elitecollections.qa) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.elitecollections.qa;
    return 404; # managed by Certbot


}
