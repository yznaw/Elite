# Response compression for every site on this host.
#
# Deployed to /etc/nginx/conf.d/compression.conf.
#
# WHY THIS IS A SEPARATE FILE, NOT PART OF elite.conf:
# these are http-context directives. `sites-enabled/*` is included inside the
# http block, so putting them in a site file puts them in http context too --
# which works right up until a second site file does the same thing and nginx
# refuses to start with "directive is duplicate". conf.d is the right home.
#
# DO NOT ADD `gzip on;` HERE. Ubuntu's stock /etc/nginx/nginx.conf already has
# it active (line ~46) and a second one in the same context is a hard error.
# What that stock config leaves commented out is gzip_types, which is the
# actual bug: with it absent nginx falls back to `text/html` alone, so the
# HTML was compressed while the Angular bundle -- ~500 kB raw against ~120 kB
# gzipped -- was served whole. Compressed HTML is what hid it.

gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/rss+xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;
# Images and fonts (woff2) arrive already compressed; re-gzipping them burns
# CPU for nothing.
